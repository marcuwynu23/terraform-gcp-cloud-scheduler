name: CD - GCP Cloud Scheduler (Destroy)

on:
  workflow_dispatch:
    inputs:

      project_id:
        description: GCP project ID
        required: true
        type: string

      region:
        description: "GCP region (Free Tier: us-west1, us-central1, us-east1)"
        required: true
        type: string
        default: us-central1

      job_name:
        description: job name
        required: true
        type: string

      job_description:
        description: job description
        required: true
        type: string

      schedule:
        description: schedule
        required: true
        type: string

      time_zone:
        description: time zone
        required: true
        type: string

      attempt_deadline:
        description: attempt deadline
        required: true
        type: string

      http_method:
        description: http method
        required: true
        type: string

      target_uri:
        description: target uri
        required: true
        type: string

      body:
        description: body
        required: true
        type: string

      headers:
        description: headers
        required: true
        type: string

      oidc_sa_email:
        description: oidc sa email
        required: true
        type: string

      oidc_audience:
        description: oidc audience
        required: true
        type: string

env:
  TF_BUCKET_NAME: ${{ secrets.TF_BUCKET_NAME }}
  TF_BUCKET_PREFIX: ${{ secrets.TF_BUCKET_PREFIX }}
jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: latest
    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=$TF_BUCKET_NAME" \
          -backend-config="prefix=$TF_BUCKET_PREFIX"
    - name: Terraform Plan
      run: |
        terraform plan -destroy  \
          -var="project_id=${{ github.event.inputs.project_id }}" \
          -var="region=${{ github.event.inputs.region }}" \
          -var="job_name=${{ github.event.inputs.job_name }}" \
          -var="job_description=${{ github.event.inputs.job_description }}" \
          -var="schedule=${{ github.event.inputs.schedule }}" \
          -var="time_zone=${{ github.event.inputs.time_zone }}" \
          -var="attempt_deadline=${{ github.event.inputs.attempt_deadline }}" \
          -var="http_method=${{ github.event.inputs.http_method }}" \
          -var="target_uri=${{ github.event.inputs.target_uri }}" \
          -var="body=${{ github.event.inputs.body }}" \
          -var="headers=${{ github.event.inputs.headers }}" \
          -var="oidc_sa_email=${{ github.event.inputs.oidc_sa_email }}" \
          -var="oidc_audience=${{ github.event.inputs.oidc_audience }}"
    - name: Terraform Destroy
      run: |
        terraform destroy -auto-approve  \
          -var="project_id=${{ github.event.inputs.project_id }}" \
          -var="region=${{ github.event.inputs.region }}" \
          -var="job_name=${{ github.event.inputs.job_name }}" \
          -var="job_description=${{ github.event.inputs.job_description }}" \
          -var="schedule=${{ github.event.inputs.schedule }}" \
          -var="time_zone=${{ github.event.inputs.time_zone }}" \
          -var="attempt_deadline=${{ github.event.inputs.attempt_deadline }}" \
          -var="http_method=${{ github.event.inputs.http_method }}" \
          -var="target_uri=${{ github.event.inputs.target_uri }}" \
          -var="body=${{ github.event.inputs.body }}" \
          -var="headers=${{ github.event.inputs.headers }}" \
          -var="oidc_sa_email=${{ github.event.inputs.oidc_sa_email }}" \
          -var="oidc_audience=${{ github.event.inputs.oidc_audience }}"
