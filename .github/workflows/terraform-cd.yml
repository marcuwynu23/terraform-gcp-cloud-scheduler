name: CD - GCP Cloud Scheduler (Apply / Destroy)

on:
  workflow_dispatch:
    inputs:
      command:
        description: Terraform operation
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply
      project_id:
        description: GCP project ID
        required: true
        type: string
      region:
        description: "GCP region (Free Tier: us-east1, us-west1, us-central1)"
        required: true
        type: string
        default: us-central1
      job_name:
        description: Cloud Scheduler job name
        required: true
        type: string
        default: my-scheduler-job
      job_description:
        description: Job description
        required: true
        type: string
        default: Triggers a Cloud Run service periodically
      schedule:
        description: Cron schedule
        required: true
        type: string
        default: 0 */3 * * *
      time_zone:
        description: Time zone
        required: true
        type: string
        default: UTC
      attempt_deadline:
        description: Execution attempt deadline
        required: true
        type: string
        default: 180s
      http_method:
        description: HTTP method for the target
        required: true
        type: string
        default: POST
      target_uri:
        description: HTTP target URI
        required: true
        type: string
        default: https://your-cloud-run-service-uc.a.run.app
      body:
        description: HTTP request body
        required: false
        type: string
        default: '{"schedule": "trigger"}'
      headers:
        description: HTTP headers as HCL map, e.g. {"Content-Type"="application/json"}
        required: false
        type: string
        default: '{"Content-Type"="application/json"}'
      oidc_sa_email:
        description: OIDC service account email
        required: false
        type: string
        default: ""
      oidc_audience:
        description: OIDC audience
        required: false
        type: string
        default: ""

env: {}

jobs:
  provision:
    name: Terraform ${{ github.event.inputs.command }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
      - name: Terraform Init
        run: terraform init
      - name: Terraform Plan
        run: |
          terraform plan ${{ github.event.inputs.command == 'destroy' && '-destroy' || '' }} \
            -var="project_id=${{ github.event.inputs.project_id }}" \
            -var="region=${{ github.event.inputs.region }}" \
            -var="job_name=${{ github.event.inputs.job_name }}" \
            -var="job_description=${{ github.event.inputs.job_description }}" \
            -var="schedule=${{ github.event.inputs.schedule }}" \
            -var="time_zone=${{ github.event.inputs.time_zone }}" \
            -var="attempt_deadline=${{ github.event.inputs.attempt_deadline }}" \
            -var="http_method=${{ github.event.inputs.http_method }}" \
            -var="target_uri=${{ github.event.inputs.target_uri }}" \
            -var="body=${{ github.event.inputs.body }}" \
            -var="headers=${{ github.event.inputs.headers }}" \
            -var="oidc_sa_email=${{ github.event.inputs.oidc_sa_email }}" \
            -var="oidc_audience=${{ github.event.inputs.oidc_audience }}"
      - name: Terraform Apply / Destroy
        run: |
          terraform ${{ github.event.inputs.command }} -auto-approve \
            -var="project_id=${{ github.event.inputs.project_id }}" \
            -var="region=${{ github.event.inputs.region }}" \
            -var="job_name=${{ github.event.inputs.job_name }}" \
            -var="job_description=${{ github.event.inputs.job_description }}" \
            -var="schedule=${{ github.event.inputs.schedule }}" \
            -var="time_zone=${{ github.event.inputs.time_zone }}" \
            -var="attempt_deadline=${{ github.event.inputs.attempt_deadline }}" \
            -var="http_method=${{ github.event.inputs.http_method }}" \
            -var="target_uri=${{ github.event.inputs.target_uri }}" \
            -var="body=${{ github.event.inputs.body }}" \
            -var="headers=${{ github.event.inputs.headers }}" \
            -var="oidc_sa_email=${{ github.event.inputs.oidc_sa_email }}" \
            -var="oidc_audience=${{ github.event.inputs.oidc_audience }}"
